[package]
name = "wifitui"
version = "0.1.0"
license = "GPL-3.0"
edition = "2024"
readme = "README.md"
authors = ["El-ameen Daiyabu <thisiselameen@gmail.com>"]
description = "A TUI for managing WiFi on Linux via NetworkManager"
homepage = "https://github.com/elameendaiyabu/wifitui"
repository = "https://github.com/elameendaiyabu/wifitui"

[dependencies]
# TUI framework
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# D-Bus communication with NetworkManager
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"

# Text input widget for password field
tui-input = "0.11"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Utilities
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
bitflags = "2"
futures = "0.3"

[profile.release]
strip = true
codegen-units = 1
lto = "fat"
opt-level = 3
